[project]
name = "tendon"
version = "0.1.0"
description = "预应力钢束理论伸长量计算工具"
requires-python = ">=3.14"
dependencies = []

[project.optional-dependencies]
# 仅用于运行 ref 目录参考脚本及新旧结果回归对比。
reference-comparison = [
    "scipy>=1.18,<2.0",
    "sympy>=1.14,<2.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]
